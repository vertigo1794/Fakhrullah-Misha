<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jQuery AJAX Exercise</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 30px;
  background: #f4f4f4;
}
#div1 {
  background: white;
  border: 1px solid #ccc;
  padding: 20px;
  margin-bottom: 15px;
}
button {
  padding: 10px 16px;
  cursor: pointer;
}
</style>
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script>
$(document).ready(function(){
  $("button").click(function(){
    $.ajax({
      url: "https://raw.githubusercontent.com/vertigo1794/Fakhrullah-Misha/main/uploads/1789752210598-fakhrullah-welcome.txt",
      success: function(result){
        $("#div1").html(result);
      }
    });
  });
});
</script>
</head>
<body>
<div id="div1"><h2>jQuery AJAX Exercise</h2></div>
<button>Get External Content</button>
</body>
</html>
