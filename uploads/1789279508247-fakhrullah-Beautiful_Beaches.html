<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beautiful Beaches</title>
  <style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #eef1f7;
  color: #222;
}

header {
  background: #3046a8;
  color: white;
  padding: 16px 24px;
  text-align: center;
}
header h1 {
  margin: 0;
  font-size: 26px;
}
main {
  width: min(900px, 94%);
  margin: 24px auto;
  background: white;
  padding: 18px;
  border-radius: 10px;
  box-shadow: 0 3px 12px rgba(0,0,0,.15);
}
#featured {
  position: relative;
  margin: 0 0 16px;
  overflow: hidden;
}
#featured img {
  width: 100%;
  display: block;
  border-radius: 6px;
}
#featured figcaption {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 18px;
  text-align: center;
  background: rgba(255,255,255,.85);
  font-size: 22px;
  font-weight: bold;
  opacity: 0;
}
#thumbnails {
  display: flex;
  gap: 10px;
  list-style: none;
  padding: 0;
  margin: 0;
  flex-wrap: wrap;
}
#thumbnails li {
  flex: 1 1 130px;
}
#thumbnails img {
  width: 100%;
  height: 100px;
  object-fit: cover;
  border: 3px solid #ddd;
  cursor: pointer;
  border-radius: 5px;
}
#thumbnails img:hover {
  border-color: #3046a8;
}
  </style>
</head>
<body>
  <header>
    <h1>Beautiful Beaches</h1>
  </header>
  <main>
    <figure id="featured">
      <img src="images/sunset-beach-sunset-beach-medium.jpg" title="Sunset Beach" alt="Sunset Beach">
      <figcaption>Sunset Beach</figcaption>
    </figure>
    <ul id="thumbnails">
        <li><img src="images/sunset-beach-coral-bay-small.jpg" title="Coral Bay" alt="Coral Bay"></li>
        <li><img src="images/sunset-beach-tropical-island-small.jpg" title="Tropical Island" alt="Tropical Island"></li>
        <li><img src="images/sunset-beach-blue-lagoon-small.jpg" title="Blue Lagoon" alt="Blue Lagoon"></li>
        <li><img src="images/sunset-beach-golden-beach-small.jpg" title="Golden Beach" alt="Golden Beach"></li>
        <li><img src="images/sunset-beach-palm-beach-small.jpg" title="Palm Beach" alt="Palm Beach"></li>
    </ul>
  </main>

  <script>
window.addEventListener("load", function() {
    var thumbs = document.getElementById("thumbnails");
    thumbs.addEventListener("click", function (e) {
        if (e.target.nodeName.toLowerCase() == 'img') {
            var clickedImageSource = e.target.src;
            var newSrc = clickedImageSource.replace("small", "medium");
            var featuredImage = document.querySelector("#featured img");
            featuredImage.src = newSrc;
            featuredImage.title = e.target.title;
        }
    });
    var featured = document.getElementById("featured");
    featured.addEventListener("mouseover", function (e) {
        var caption = document.querySelector("#featured figcaption");
        caption.style.transition = "opacity 1.5s";
        caption.style.opacity = 0.80;
        caption.innerHTML = document.querySelector("#featured img").title;
    });
    featured.addEventListener("mouseout", function (e) {
        var caption = document.querySelector("#featured figcaption");
        caption.style.transition = "opacity 1.5s";
        caption.style.opacity = 0;
    });
});
  </script>
</body>
</html>
