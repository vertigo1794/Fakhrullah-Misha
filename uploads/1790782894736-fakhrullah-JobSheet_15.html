<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guestbook</title>
<style>
body {
  font-family: "Segoe UI", Arial, sans-serif;
  max-width: 720px;
  margin: 30px auto;
  padding: 28px 32px;
  background: #ffffff;
  color: #2c3e50;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(44, 62, 80, 0.12);
  border-top: 6px solid #5b7cfa;
}
html {
  background: linear-gradient(135deg, #eef2ff, #f8f9fc);
  min-height: 100%;
}
h2 {
  margin-top: 0;
  color: #34495e;
  border-bottom: 2px solid #eef2ff;
  padding-bottom: 8px;
}
button {
  padding: 10px 18px;
  margin: 4px;
  border: 0;
  border-radius: 8px;
  background: linear-gradient(135deg, #5b7cfa, #7958e8);
  color: white;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 3px 8px rgba(91, 124, 250, 0.3);
  transition: transform 0.15s, box-shadow 0.15s;
}
button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 14px rgba(91, 124, 250, 0.4);
}
button:disabled {
  background: #b0b8c9;
  box-shadow: none;
  cursor: not-allowed;
  transform: none;
}
input, textarea, select {
  border: 1px solid #cfd8e3;
  border-radius: 8px;
  outline: none;
  font: inherit;
}
input:focus, textarea:focus, select:focus {
  border-color: #5b7cfa;
  box-shadow: 0 0 0 3px rgba(91, 124, 250, 0.2);
}
p, li {
  line-height: 1.6;
}
@media print {
  html { background: white; }
  body { box-shadow: none; }
}
.entry {
  background: #f8f9fc;
  border-left: 4px solid #5b7cfa;
  padding: 8px 12px;
  margin: 8px 0;
}
.entry p {
  margin: 4px 0 0;
}
#error {
  color: #c0392b;
}
input, textarea {
  padding: 8px;
}
</style>
<script>
document.addEventListener("DOMContentLoaded", function(){
  let entries = JSON.parse(localStorage.getItem("guestbook")) || [];

  function render(){
    const box = document.getElementById("entries");
    box.innerHTML = "";
    entries.slice().reverse().forEach(function(e){
      const div = document.createElement("div");
      div.className = "entry";
      const b = document.createElement("b");
      b.textContent = e.name + " (" + e.date + ")";
      const p = document.createElement("p");
      p.textContent = e.message;
      div.appendChild(b);
      div.appendChild(p);
      box.appendChild(div);
    });
  }

  render();

  document.getElementById("signBtn").addEventListener("click", function(){
    const name = document.getElementById("gName").value.trim();
    const message = document.getElementById("gMsg").value.trim();
    if (name === "" || message === "") {
      document.getElementById("error").textContent = "Name and message are required.";
      return;
    }
    document.getElementById("error").textContent = "";
    entries.push({ name: name, message: message, date: new Date().toLocaleDateString() });
    localStorage.setItem("guestbook", JSON.stringify(entries));
    document.getElementById("gName").value = "";
    document.getElementById("gMsg").value = "";
    render();
  });
});
</script>
</head>
<body>
<h2>Guestbook</h2>
<p><input id="gName" placeholder="Name"></p>
<p><textarea id="gMsg" rows="3" cols="40" placeholder="Message"></textarea></p>
<button id="signBtn">Sign Guestbook</button>
<p id="error"></p>
<div id="entries"></div>
</body>
</html>
